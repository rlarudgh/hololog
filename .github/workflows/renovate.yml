name: Renovate

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/renovatebot/renovate:39
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_GIT_AUTHOR: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_BASE_DIR: ${{ github.workspace }}
          LOG_LEVEL: 'info'
        run: renovate
