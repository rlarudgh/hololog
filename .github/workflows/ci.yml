# ci.yml
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Bun
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Setup Node.js with version from .nvmrc
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Install dependencies
      - name: Install dependencies
        run: bun install

      # Run linting
      - name: Run ESLint
        run: bun run lint

      # Run TypeScript type checking
      - name: Run type check
        run: bun run tsc --noEmit

      # Run tests with Vitest
      - name: Run tests
        run: bun run test:run
        env:
          NODE_ENV: test
          CI: true
          FORCE_COLOR: '1'
        timeout-minutes: 10

      # Build application
      - name: Build application
        run: bun run build
        env:
          NODE_ENV: production

      # Upload artifacts on failure for debugging
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-artifacts
          path: |
            bun.lockb
            .next
          retention-days: 3

  coverage:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: bun install

      - name: Run tests with coverage
        run: bun run test:coverage
        env:
          NODE_ENV: test
          CI: true

      # Upload coverage report
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
